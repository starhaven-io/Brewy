name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - "Brewy/**"
      - "BrewyTests/**"
      - "BrewyUITests/**"

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@ed413fa67dece92d3870a46750b7a2fb622b2624 # v2026.11.10.1
    with:
      languages: '["swift"]'
      runner: "macos-26"
      timeout-minutes: 45
      build-mode: "manual"
      build-profile: "brewy-xcode"
