name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - "Brewy/**"
      - "BrewyTests/**"
      - "BrewyUITests/**"

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@7ffa044d5dadee7a17c504bd18bedc48057bf224 # v2026.07.05.2
    with:
      languages: '["swift"]'
      runner: "macos-26"
      timeout-minutes: 30
      build-mode: "manual"
      build-profile: "brewy-xcode"
