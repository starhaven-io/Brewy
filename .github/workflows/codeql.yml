name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - "Brewy/**"
      - "BrewyTests/**"
      - "BrewyUITests/**"

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@9d720ff00c3d9ecd1d9e13d4f636bf9a1daba5d7 # v2026.07.30.1
    with:
      languages: '["swift"]'
      runner: "macos-26"
      timeout-minutes: 30
      build-mode: "manual"
      build-profile: "brewy-xcode"
