name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - "Brewy/**"
      - "BrewyTests/**"
      - "BrewyUITests/**"

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@f2743b4ed9ea23c0e1c9ba2f39345b8a74070039 # v2026.10.16.1
    with:
      languages: '["swift"]'
      runner: "macos-26"
      timeout-minutes: 45
      build-mode: "manual"
      build-profile: "brewy-xcode"
