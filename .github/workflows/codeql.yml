name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - "Brewy/**"
      - "BrewyTests/**"
      - "BrewyUITests/**"

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@f94330a416d4e38888a28553aa8efa2725fedbb6 # v2026.10.08.3
    with:
      languages: '["swift"]'
      runner: "macos-26"
      timeout-minutes: 45
      build-mode: "manual"
      build-profile: "brewy-xcode"
