name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - "Brewy/**"
      - "BrewyTests/**"
      - "BrewyUITests/**"

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@fa61548f8fe7ee08b5b939bfbec5900c6c54306d # v2026.09.06.4
    with:
      languages: '["swift"]'
      runner: "macos-26"
      timeout-minutes: 45
      build-mode: "manual"
      build-profile: "brewy-xcode"
