name: Release

on:
  workflow_dispatch:

defaults:
  run:
    # No -x: this workflow handles signing/notarization secrets, Sparkle
    # signing secrets, generated keychain passwords, and short-lived app tokens.
    shell: bash -euo pipefail {0}

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}

jobs:
  validate-dispatch:
    name: Validate dispatch
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Require main branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Release workflow must be dispatched from main, got ${REF_NAME}."
            exit 1
          fi

  build:
    name: Build
    needs: validate-dispatch
    runs-on: macos-26
    timeout-minutes: 60
    environment:
      name: release
      deployment: false
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      build_number: ${{ steps.version.outputs.build_number }}
      artifact_name: "Brewy-${{ steps.version.outputs.tag }}.zip"
      sign_update_sha256: ${{ steps.sparkle-signing-tool.outputs.sha256 }}
    permissions:
      contents: read # required to checkout the release source
    env:
      TEMPORARY_CERTIFICATE_FILE: "brewy_developer_id_certificate.p12"
      TEMPORARY_KEYCHAIN_FILE: "brewy_signing.keychain-db"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version from Xcode project
        id: version
        run: |
          SETTINGS=$(xcodebuild -project Brewy.xcodeproj -target Brewy -configuration Release -showBuildSettings 2>/dev/null)
          TAG=$(echo "${SETTINGS}" | awk -F' = ' '/^[[:space:]]*MARKETING_VERSION[[:space:]]*=/ {print $2; exit}')
          BUILD_NUMBER=$(echo "${SETTINGS}" | awk -F' = ' '/^[[:space:]]*CURRENT_PROJECT_VERSION[[:space:]]*=/ {print $2; exit}')
          if [[ -z "${TAG}" ]]; then
            echo "::error::Could not extract MARKETING_VERSION from Brewy target"
            exit 1
          fi
          if [[ -z "${BUILD_NUMBER}" ]]; then
            echo "::error::Could not extract CURRENT_PROJECT_VERSION from Brewy target"
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${BUILD_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"

      - name: Ensure release tag is available
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists."
            exit 1
          fi
          if gh api "repos/${REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists."
            exit 1
          fi

      - name: Create and unlock temporary macOS keychain
        run: |
          # Keep xtrace disabled here: this password is generated at runtime and is not a registered secret.
          set +x
          TEMPORARY_KEYCHAIN_PASSWORD="$(openssl rand -base64 20)"
          echo "::add-mask::${TEMPORARY_KEYCHAIN_PASSWORD}"
          TEMPORARY_KEYCHAIN_PATH="${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}"
          security create-keychain -p "${TEMPORARY_KEYCHAIN_PASSWORD}" "${TEMPORARY_KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${TEMPORARY_KEYCHAIN_PATH}"
          security unlock-keychain -p "${TEMPORARY_KEYCHAIN_PASSWORD}" "${TEMPORARY_KEYCHAIN_PATH}"

      - name: Create temporary certificate file
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
        run: echo -n "${DEVELOPER_ID_CERTIFICATE}" |
          base64 --decode --output="${RUNNER_TEMP}/${TEMPORARY_CERTIFICATE_FILE}"

      - name: Import certificate into keychain
        env:
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: security import "${RUNNER_TEMP}/${TEMPORARY_CERTIFICATE_FILE}"
          -k "${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}"
          -P "${DEVELOPER_ID_CERTIFICATE_PASSWORD}"
          -t cert -f pkcs12 -A

      - name: Clean up temporary certificate file
        if: always()
        run: rm -f "${RUNNER_TEMP}/${TEMPORARY_CERTIFICATE_FILE}"

      - name: Open keychain
        run: security list-keychain -d user -s "${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}"

      - name: Archive
        run: |
          xcodebuild archive \
            -project Brewy.xcodeproj \
            -scheme Brewy \
            -destination 'generic/platform=macOS' \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            -archivePath "${RUNNER_TEMP}/Brewy.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${DEVELOPMENT_TEAM}" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            EXCLUDED_ARCHS=x86_64

      - name: Export
        run: |
          cat > "${RUNNER_TEMP}/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>teamID</key>
              <string>${DEVELOPMENT_TEAM}</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/Brewy.xcarchive" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
            -exportPath "${RUNNER_TEMP}/export"

      - name: Clean up temporary keychain
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}" ]]; then
            security delete-keychain "${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}"
          fi

      - name: Package
        run: |
          ditto -c -k --keepParent \
            "${RUNNER_TEMP}/export/Brewy.app" \
            "${RUNNER_TEMP}/Brewy-${TAG}.zip"

      - name: Stage Sparkle signing tool
        id: sparkle-signing-tool
        run: |
          SPARKLE_SIGN_UPDATE="${RUNNER_TEMP}/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
          if [[ ! -x "${SPARKLE_SIGN_UPDATE}" ]]; then
            echo "::error::Could not find Sparkle sign_update in the resolved Swift package artifact."
            exit 1
          fi
          cp "${SPARKLE_SIGN_UPDATE}" "${RUNNER_TEMP}/sign_update"
          SIGN_UPDATE_SHA256=$(shasum -a 256 "${RUNNER_TEMP}/sign_update")
          echo "sha256=${SIGN_UPDATE_SHA256%% *}" >> "${GITHUB_OUTPUT}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "Brewy-${{ steps.version.outputs.tag }}.zip"
          path: |
            ${{ runner.temp }}/Brewy-${{ steps.version.outputs.tag }}.zip
            ${{ runner.temp }}/sign_update

  release:
    name: Release
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    environment:
      name: release
      deployment: false
    permissions:
      contents: write # required to create GitHub releases
      attestations: write # required to attest the published (notarized + stapled) asset
      id-token: write # required to generate build provenance attestations
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "${{ needs.build.outputs.artifact_name }}"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          xcrun notarytool submit "${ARTIFACT_NAME}" \
            --team-id "${DEVELOPMENT_TEAM}" \
            --apple-id "${APPLE_ID}" \
            --password "${NOTARIZATION_PASSWORD}" \
            --wait
          ditto -xk "${ARTIFACT_NAME}" "${RUNNER_TEMP}/staple"
          xcrun stapler staple "${RUNNER_TEMP}/staple/Brewy.app"
          ditto -c -k --keepParent \
            "${RUNNER_TEMP}/staple/Brewy.app" \
            "${ARTIFACT_NAME}"

      - name: Verify stapled app
        env:
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          ditto -xk "${ARTIFACT_NAME}" "${RUNNER_TEMP}/verify"
          APP_PATH="${RUNNER_TEMP}/verify/Brewy.app"
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          xcrun stapler validate "${APP_PATH}"
          spctl -a -t exec -vv "${APP_PATH}"
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP_PATH}/Contents/Info.plist")
          if [[ "${BUNDLE_VERSION}" != "${TAG}" ]]; then
            echo "::error::Built app version ${BUNDLE_VERSION} does not match release tag ${TAG}."
            exit 1
          fi

      - name: Generate build provenance for the published asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # Attest the final notarized + stapled zip that is actually uploaded to the release, so
          # `gh attestation verify` against the published download matches the attested digest.
          subject-path: ${{ needs.build.outputs.artifact_name }}

      - name: Sign update with Sparkle EdDSA
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          SIGN_UPDATE_SHA256: ${{ needs.build.outputs.sign_update_sha256 }}
        run: |
          if [[ -z "${SIGN_UPDATE_SHA256}" ]]; then
            echo "::error::Could not read the staged Sparkle sign_update checksum."
            exit 1
          fi
          echo "${SIGN_UPDATE_SHA256}  sign_update" | shasum -a 256 -c -
          chmod 0755 sign_update
          SPARKLE_KEY_FILE="${RUNNER_TEMP}/sparkle_private_key"
          trap 'rm -f "${SPARKLE_KEY_FILE}"' EXIT
          echo "${SPARKLE_KEY}" > "${SPARKLE_KEY_FILE}"
          SIG_OUTPUT=$(./sign_update "${ARTIFACT_NAME}" --ed-key-file "${SPARKLE_KEY_FILE}" 2>&1)
          echo "SPARKLE_SIG=$(echo "${SIG_OUTPUT}" | grep -o 'sparkle:edSignature="[^"]*"' | cut -d'"' -f2)" >> "${GITHUB_ENV}"
          echo "SPARKLE_LENGTH=$(echo "${SIG_OUTPUT}" | grep -o 'length="[^"]*"' | cut -d'"' -f2)" >> "${GITHUB_ENV}"

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "${TAG}" \
            --repo "${REPOSITORY}" \
            --target "${COMMIT_SHA}" \
            --title "${TAG}" \
            --generate-notes \
            "${ARTIFACT_NAME}"
          gh release view "${TAG}" \
            --repo "${REPOSITORY}" \
            --json body \
            --jq '.body' > "${RUNNER_TEMP}/raw_notes.md"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Format release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 .github/format-release-notes.py \
            "${RUNNER_TEMP}/raw_notes.md" "${TAG}" \
            > "${RUNNER_TEMP}/formatted_notes.md"
          python3 .github/format-release-notes.py \
            "${RUNNER_TEMP}/raw_notes.md" "${TAG}" --html \
            > "${RUNNER_TEMP}/release_notes.html"
          gh release edit "${TAG}" \
            --repo "${REPOSITORY}" \
            --notes-file "${RUNNER_TEMP}/formatted_notes.md"

      - name: Update appcast
        env:
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          REPOSITORY: ${{ github.repository }}
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
        run: |
          PUBDATE="$(date -u '+%a, %d %b %Y %H:%M:%S %z')"
          DOWNLOAD_URL="https://github.com/${REPOSITORY}/releases/download/${TAG}/${ARTIFACT_NAME}"
          RELEASE_NOTES_HTML="$(cat "${RUNNER_TEMP}/release_notes.html")"
          export PUBDATE DOWNLOAD_URL RELEASE_NOTES_HTML
          envsubst "\$TAG \$PUBDATE \$BUILD_NUMBER \$DOWNLOAD_URL \$SPARKLE_LENGTH \$SPARKLE_SIG \$RELEASE_NOTES_HTML" \
            < .github/appcast-template.xml > appcast.xml

      - name: Push appcast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AUTH_HEADER="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          cp appcast.xml "${RUNNER_TEMP}/appcast.xml"
          git -c "http.extraheader=AUTHORIZATION: Basic ${AUTH_HEADER}" fetch origin appcast
          git checkout appcast
          cp "${RUNNER_TEMP}/appcast.xml" appcast.xml
          git add appcast.xml
          git diff --cached --quiet && exit 0
          git commit -m "Update appcast for ${TAG}"
          git -c "http.extraheader=AUTHORIZATION: Basic ${AUTH_HEADER}" push origin appcast

  bump-cask:
    name: Bump tap cask
    needs: [build, release]
    runs-on: macos-26
    timeout-minutes: 60
    environment:
      name: release
      deployment: false
    permissions: {}
    env:
      VERSION: ${{ needs.build.outputs.tag }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          stable: true

      - name: Mint bot token for tap
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Bump Homebrew cask
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.tap-token.outputs.token }}
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ENV_HINTS: 1
          APP_SLUG: ${{ steps.tap-token.outputs.app-slug }}
        run: |
          BOT_USER="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "/users/${BOT_USER}" --jq .id)
          export HOMEBREW_GIT_NAME="${BOT_USER}"
          export HOMEBREW_GIT_EMAIL="${BOT_ID}+${BOT_USER}@users.noreply.github.com"
          brew tap starhaven-io/tap
          brew trust starhaven-io/tap
          brew bump-cask-pr --no-fork --version "${VERSION}" starhaven-io/tap/brewy

          BRANCH_VERSION="${VERSION//,/-}"
          BRANCH_VERSION="${BRANCH_VERSION//:/-}"
          BRANCH="bump-brewy-${BRANCH_VERSION}"
          PR_NUMBER=$(gh pr list \
            --repo starhaven-io/homebrew-tap \
            --head "${BRANCH}" \
            --state open \
            --json number,headRepositoryOwner \
            --jq 'map(select(.headRepositoryOwner.login == "starhaven-io")) | .[0].number // ""' || true)
          if [ -n "${PR_NUMBER}" ]; then
            gh pr merge "${PR_NUMBER}" --repo starhaven-io/homebrew-tap --auto --squash \
              || echo "::warning::could not enable auto-merge for starhaven-io/homebrew-tap#${PR_NUMBER}"
          else
            echo "::warning::could not find open Homebrew cask bump PR for ${BRANCH}"
          fi
