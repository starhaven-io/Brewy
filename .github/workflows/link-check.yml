name: Link Check

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "lychee.toml"
  schedule:
    - cron: "0 14 * * 1" # every Monday at 14:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: "link-check-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lychee:
    name: Check links
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-link-check.yml@f94330a416d4e38888a28553aa8efa2725fedbb6 # v2026.10.08.3
    with:
      args: "--config lychee.toml README.md CONTRIBUTING.md SECURITY.md"
      build-site: false
      site-directory: ""
      authenticated-github: true
