name: Link Check

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "lychee.toml"
  schedule:
    - cron: "0 14 * * 1" # every Monday at 14:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: "link-check-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lychee:
    name: Check links
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-link-check.yml@0cffea358b31930d0068ad1419e7522d1ea37764 # v2026.07.16.3
    with:
      args: "--config lychee.toml README.md CONTRIBUTING.md"
      build-site: false
      site-directory: ""
      authenticated-github: true
