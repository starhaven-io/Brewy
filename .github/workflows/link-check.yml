name: Link Check

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "lychee.toml"
  schedule:
    - cron: "0 14 * * 1" # every Monday at 14:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Check links
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-link-check.yml@dc64ac16c4a6e908a7094bccd8442b57f7222199 # v2026.07.05.1
    with:
      args: "--config lychee.toml README.md CONTRIBUTING.md"
      build-site: false
      site-directory: ""
      authenticated-github: true
