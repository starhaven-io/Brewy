name: Link Check

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "lychee.toml"
  schedule:
    - cron: "0 14 * * 1" # every Monday at 14:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: "link-check-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lychee:
    name: Check links
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-link-check.yml@74aa5391c55e434b2d4ffb72e52c8f524bde8a02 # v2026.07.25.1
    with:
      args: "--config lychee.toml README.md CONTRIBUTING.md"
      build-site: false
      site-directory: ""
      authenticated-github: true
