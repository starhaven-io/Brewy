name: Link Check

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "lychee.toml"
  schedule:
    - cron: "0 14 * * 1" # every Monday at 14:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: "link-check-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lychee:
    name: Check links
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-link-check.yml@53fd167c64823089351b4c7cebfefdfde2df0ac6 # v2026.09.04.2
    with:
      args: "--config lychee.toml README.md CONTRIBUTING.md"
      build-site: false
      site-directory: ""
      authenticated-github: true
