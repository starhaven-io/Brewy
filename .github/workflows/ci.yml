name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  # PR body/title edits fire `edited` events; give them their own per-run group so
  # they can't cancel in-flight tests from the preceding `opened`/`synchronize` run.
  group: ${{ github.event.action == 'edited' && format('ci-edit-{0}-{1}', github.ref, github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

permissions: {}

jobs:
  generate-matrix:
    name: Generate matrix
    runs-on: ubuntu-24.04 # ruby/setup-ruby does not support ubuntu-slim.
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      run_codecov: ${{ steps.matrix.outputs.run_codecov }}
      run_codeql: ${{ steps.matrix.outputs.run_codeql }}
      run_zizmor: ${{ steps.matrix.outputs.run_zizmor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select trusted router Ruby
        id: trusted-ruby
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Pull request base SHA must be a full commit hash."
            exit 1
          fi
          if git cat-file -e "${BASE_SHA}:scripts/ci-path-routing.rb"; then
            RUBY_VERSION=$(git show "${BASE_SHA}:.ruby-version")
            if [[ ! "${RUBY_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Trusted router Ruby version is invalid."
              exit 1
            fi
            echo "version=${RUBY_VERSION}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Ruby
        if: steps.trusted-ruby.outputs.version != ''
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ steps.trusted-ruby.outputs.version }}
          bundler: none
          bundler-cache: false

      - name: Generate CI matrix
        id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          MATRIX='[]'
          add_check() {
            local entry="$1"
            if [[ "${MATRIX}" == "[]" ]]; then
              MATRIX="[${entry}]"
            else
              MATRIX="${MATRIX%]},${entry}]"
            fi
          }

          # Push to main: run Homebrew-backed checks so their default-branch
          # caches can seed PRs, plus test-tsan so Codecov has a baseline for
          # PR coverage comparisons.
          if [[ "${EVENT_NAME}" == "push" ]]; then
            add_check '{"name":"Lint","check":"lint","runner":"macos-26"}'
            add_check '{"name":"Build Brew JSON Probe","check":"probe-build","runner":"macos-26"}'
            add_check '{"name":"Test (Thread Sanitizer)","check":"test-tsan","runner":"macos-26","xcodebuild_flags":"-only-testing:BrewyTests -enableCodeCoverage YES -enableThreadSanitizer YES","result_bundle":"TestResults-TSAN"}'
            add_check '{"name":"Test (signed UI runner)","check":"test-ui","runner":"macos-26","xcodebuild_flags":"-only-testing:BrewyUITests","result_bundle":"TestResults-UI"}'
            add_check '{"name":"Release helper validation","check":"release-helpers","runner":"ubuntu-24.04"}'
            {
              echo "matrix=${MATRIX}"
              echo "run_codeql=false"
              echo "run_zizmor=false"
              echo "run_codecov=true"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # `edited` (title/body/base) also runs the full path-derived matrix. The
          # aggregate "conclusion" job is the only required status check, so it must
          # certify every relevant leg for the current commit. Collapsing to a
          # commits-only matrix on `edited` lets a green run overwrite a prior failing
          # one on the same SHA, bypassing tests, lint, CodeQL and the rest.
          # Routing policy is a merge control, so never source its implementation
          # from the untrusted PR checkout. During the helper's first introduction,
          # fail closed to every route until a trusted base revision exists.
          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Pull request base SHA must be a full commit hash."
            exit 1
          fi
          ROUTER_FILE="${RUNNER_TEMP}/brewy-ci-path-routing.rb"
          CHANGED_PATHS_FILE="${RUNNER_TEMP}/brewy-ci-changed-paths"
          git diff --no-renames --name-only -z "${BASE_SHA}...HEAD" > "${CHANGED_PATHS_FILE}"
          if git show "${BASE_SHA}:scripts/ci-path-routing.rb" > "${ROUTER_FILE}"; then
            ROUTES=$(ruby "${ROUTER_FILE}" "${CHANGED_PATHS_FILE}")
            jq -e 'type == "object" and ([.lint, .tests, .probe, .release_helpers, .codeql, .zizmor] | all(type == "boolean"))' <<< "${ROUTES}" >/dev/null
            NEEDS_LINT=$(jq -er 'if .lint then 1 else 0 end' <<< "${ROUTES}")
            NEEDS_TESTS=$(jq -er 'if .tests then 1 else 0 end' <<< "${ROUTES}")
            NEEDS_PROBE=$(jq -er 'if .probe then 1 else 0 end' <<< "${ROUTES}")
            NEEDS_RELEASE_HELPERS=$(jq -er 'if .release_helpers then 1 else 0 end' <<< "${ROUTES}")
            RUN_CODEQL=$(jq -r '.codeql' <<< "${ROUTES}")
            RUN_ZIZMOR=$(jq -r '.zizmor' <<< "${ROUTES}")
          else
            NEEDS_LINT=1
            NEEDS_TESTS=1
            NEEDS_PROBE=1
            NEEDS_RELEASE_HELPERS=1
            RUN_CODEQL=true
            RUN_ZIZMOR=true
          fi

          if [[ "${NEEDS_LINT}" -eq 1 ]]; then
            add_check '{"name":"Lint","check":"lint","runner":"macos-26"}'
          fi
          if [[ "${NEEDS_TESTS}" -eq 1 ]]; then
            add_check '{"name":"Test (Thread Sanitizer)","check":"test-tsan","runner":"macos-26","xcodebuild_flags":"-only-testing:BrewyTests -enableCodeCoverage YES -enableThreadSanitizer YES","result_bundle":"TestResults-TSAN"}'
            add_check '{"name":"Test (signed UI runner)","check":"test-ui","runner":"macos-26","xcodebuild_flags":"-only-testing:BrewyUITests","result_bundle":"TestResults-UI"}'
            add_check '{"name":"Test (Address Sanitizer)","check":"test-asan","runner":"macos-26","xcodebuild_flags":"-enableAddressSanitizer YES -skip-testing:BrewyUITests","result_bundle":"TestResults-ASAN"}'
            # Everything else builds Debug; without this leg the release workflow is the
            # first place Release-only breakage (optimization warnings, stray references
            # to DEBUG-gated test fixtures) can surface.
            add_check '{"name":"Build (Release)","check":"build-release","runner":"macos-26"}'
          fi

          if [[ "${NEEDS_PROBE}" -eq 1 ]]; then
            add_check '{"name":"Build Brew JSON Probe","check":"probe-build","runner":"macos-26"}'
          fi

          if [[ "${NEEDS_RELEASE_HELPERS}" -eq 1 ]]; then
            add_check '{"name":"Release helper validation","check":"release-helpers","runner":"ubuntu-24.04"}'
          fi

          {
            echo "matrix=${MATRIX}"
            echo "run_codeql=${RUN_CODEQL}"
            echo "run_zizmor=${RUN_ZIZMOR}"
            echo "run_codecov=$(jq -r 'any(.[]; .check == "test-tsan")' <<<"${MATRIX}")"
          } >> "${GITHUB_OUTPUT}"

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read # required to read PR titles
    uses: starhaven-io/.github/.github/workflows/reusable-conventional-commits.yml@be272b580ad3812dcafa195db003b178545c2de9 # v2026.10.10.1

  check:
    name: ${{ matrix.name }}
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.matrix != '[]' }}
    runs-on: ${{ matrix.runner }}
    # Cap matrix legs at 45m; sanitizer tests normally finish in about 10m and
    # the other legs are quicker. Anything past this is a hang — fail fast
    # instead of burning up to 6h of the default runner budget.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          persist-credentials: false

      - name: Set up Ruby
        if: matrix.check == 'release-helpers' || matrix.check == 'lint' || startsWith(matrix.check, 'test-')
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true

      - name: Build Brew JSON probe
        if: matrix.check == 'probe-build'
        run: bash scripts/brew-json-probe/build.sh /tmp/brew-json-probe

      - name: Validate release helpers
        if: matrix.check == 'release-helpers'
        run: bundle exec ruby scripts/validate-release-helpers.rb

      - name: Restore Homebrew downloads
        id: homebrew-cache
        if: matrix.check == 'lint'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-${{ runner.os }}-${{ matrix.check }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            homebrew-${{ runner.os }}-${{ matrix.check }}-
            homebrew-${{ runner.os }}-

      - name: Install lint tools
        if: matrix.check == 'lint'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ENV_HINTS: 1
        run: brew install swiftlint typos-cli

      - name: Save lint Homebrew downloads
        if: >
          github.event_name == 'push' &&
          matrix.check == 'lint' &&
          steps.homebrew-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ steps.homebrew-cache.outputs.cache-primary-key }}

      - name: SwiftLint
        if: matrix.check == 'lint'
        run: swiftlint --strict

      - name: Typos
        if: matrix.check == 'lint'
        run: typos

      - name: Validate CI path routing
        if: matrix.check == 'lint'
        run: ruby scripts/ci-path-routing.rb --self-test

      - name: Build (Release)
        if: matrix.check == 'build-release'
        run: |
          xcodebuild build \
            -project Brewy.xcodeproj \
            -scheme Brewy \
            -destination 'generic/platform=macOS' \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            EXCLUDED_ARCHS=x86_64

      - name: Test
        id: coverage-tests
        if: startsWith(matrix.check, 'test-')
        env:
          MATRIX_CHECK: ${{ matrix.check }}
          XCODEBUILD_FLAGS: ${{ matrix.xcodebuild_flags }}
          RESULT_BUNDLE: ${{ matrix.result_bundle }}
        run: |
          EXTRA_XCODEBUILD_FLAGS=()
          if [[ -n "${XCODEBUILD_FLAGS}" ]]; then
            read -r -a EXTRA_XCODEBUILD_FLAGS <<< "${XCODEBUILD_FLAGS}"
          fi
          if [[ "${MATRIX_CHECK}" == "test-ui" ]]; then
            SIGNING_FLAGS=(
              CODE_SIGN_STYLE=Manual
              CODE_SIGN_IDENTITY=-
              CODE_SIGNING_REQUIRED=YES
              CODE_SIGNING_ALLOWED=YES
              DEVELOPMENT_TEAM=
            )
          else
            SIGNING_FLAGS=(
              CODE_SIGN_IDENTITY=
              CODE_SIGNING_REQUIRED=NO
              CODE_SIGNING_ALLOWED=NO
            )
          fi
          xcodebuild test \
            -project Brewy.xcodeproj \
            -scheme Brewy \
            -destination 'platform=macOS' \
            -derivedDataPath ./DerivedData \
            "${EXTRA_XCODEBUILD_FLAGS[@]}" \
            -resultBundlePath "${RESULT_BUNDLE}.xcresult" \
            "${SIGNING_FLAGS[@]}" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            EXCLUDED_ARCHS=x86_64

      - name: Verify UI test runner signature
        if: success() && matrix.check == 'test-ui'
        env:
          RESULT_BUNDLE: ${{ matrix.result_bundle }}
        run: |
          BREWY_APP=$(find ./DerivedData/Build/Products -name 'Brewy.app' -type d -print -quit)
          UI_TEST_BUNDLE=$(find ./DerivedData/Build/Products -name 'BrewyUITests.xctest' -type d -print -quit)
          RUNNER_APP=$(find ./DerivedData/Build/Products -name 'BrewyUITests-Runner.app' -type d -print -quit)
          test -n "${BREWY_APP}"
          test -n "${UI_TEST_BUNDLE}"
          test -n "${RUNNER_APP}"
          codesign --verify --deep --strict --verbose=2 "${BREWY_APP}"
          codesign --verify --strict --verbose=2 "${UI_TEST_BUNDLE}"
          codesign --verify --deep --strict --verbose=2 "${RUNNER_APP}"
          xcrun xcresulttool get test-results summary \
            --path "${RESULT_BUNDLE}.xcresult" --compact |
            ruby -rjson -e 'abort "No UI tests ran" unless JSON.parse(STDIN.read.force_encoding(Encoding::UTF_8)).fetch("totalTestCount").positive?'

      - name: Coverage Summary
        if: success() && matrix.check == 'test-tsan'
        run: xcrun xccov view --report --only-targets TestResults-TSAN.xcresult

      - name: Export LCOV for Codecov
        if: success() && matrix.check == 'test-tsan'
        run: |
          PROFDATA=$(find ./DerivedData -name 'Coverage.profdata' -type f | head -1)
          if [[ -z "${PROFDATA}" ]]; then
            echo "::error::No Coverage.profdata found under ./DerivedData"
            exit 1
          fi
          BINARY_ARGS=()
          FIRST=""
          # Skip bundles nested inside .framework or .xctest — embedded helpers
          # (e.g. Sparkle's Updater.app) ship as universal binaries that
          # llvm-cov can't export without an explicit -arch.
          while IFS= read -r xctest; do
            name=$(basename "${xctest}" .xctest)
            bin="${xctest}/Contents/MacOS/${name}"
            [[ -f "${bin}" ]] || continue
            if [[ -z "${FIRST}" ]]; then FIRST="${bin}"; else BINARY_ARGS+=(-object "${bin}"); fi
          done < <(find ./DerivedData/Build/Products -name '*.xctest' -type d -not -path '*.framework/*' -not -path '*.xctest/*')
          while IFS= read -r app; do
            name=$(basename "${app}" .app)
            # Xcode Debug builds split the app into a launcher stub and a
            # .debug.dylib that carries the instrumentation; prefer the dylib.
            dylib="${app}/Contents/MacOS/${name}.debug.dylib"
            bin="${app}/Contents/MacOS/${name}"
            if [[ -f "${dylib}" ]]; then
              candidate="${dylib}"
            elif [[ -f "${bin}" ]]; then
              candidate="${bin}"
            else
              continue
            fi
            if [[ -z "${FIRST}" ]]; then FIRST="${candidate}"; else BINARY_ARGS+=(-object "${candidate}"); fi
          done < <(find ./DerivedData/Build/Products -name '*.app' -type d -not -path '*.framework/*' -not -path '*.xctest/*' -not -name '*-Runner.app')
          if [[ -z "${FIRST}" ]]; then
            echo "::error::No instrumented binaries found under ./DerivedData/Build/Products"
            exit 1
          fi
          xcrun llvm-cov export -format=lcov \
            -ignore-filename-regex='(Tests/|\.build/|DerivedData/|/Checkouts/|/SourcePackages/)' \
            "${FIRST}" \
            ${BINARY_ARGS[@]+"${BINARY_ARGS[@]}"} \
            -instr-profile="${PROFDATA}" \
            > coverage.lcov
          echo "lcov: $(wc -l < coverage.lcov) lines"

      - name: Convert xcresult to JUnit
        if: ${{ !cancelled() && matrix.check == 'test-tsan' }}
        env:
          RESULT_BUNDLE: ${{ matrix.result_bundle }}
        run: bundle exec ruby scripts/xcresult-to-junit.rb "${RESULT_BUNDLE}.xcresult" > junit.xml

      - name: Normalize report paths
        if: ${{ !cancelled() && matrix.check == 'test-tsan' }}
        env:
          TEST_RESULT: ${{ steps.coverage-tests.outcome }}
        run: |
          reports=(--junit junit.xml)
          if [[ -f coverage.lcov || "${TEST_RESULT}" != failure ]]; then
            reports+=(--coverage coverage.lcov)
          fi
          python3 -I scripts/upload-codecov.py --prepare "${reports[@]}"

      - name: Save coverage reports
        if: ${{ !cancelled() && matrix.check == 'test-tsan' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            coverage.lcov
            junit.xml
          if-no-files-found: error
          retention-days: 1

      - name: Upload Test Results
        if: always() && startsWith(matrix.check, 'test-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.result_bundle }}
          path: ${{ matrix.result_bundle }}.xcresult
          retention-days: 14


  codeql:
    name: CodeQL
    needs: generate-matrix
    if: needs.generate-matrix.outputs.run_codeql == 'true'
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@be272b580ad3812dcafa195db003b178545c2de9 # v2026.10.10.1
    with:
      languages: '["swift"]'
      runner: "macos-26"
      timeout-minutes: 45
      build-mode: "manual"
      build-profile: "brewy-xcode"

  codecov:
    name: Codecov
    needs: [generate-matrix, check]
    # Forks still run coverage tests; Codecov OIDC accepts same-repository runs.
    if: ${{ !cancelled() && needs.generate-matrix.outputs.run_codecov == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Authenticate report uploads to Codecov with GitHub OIDC.
    steps:
      - name: Check out the trusted uploader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: /scripts/upload-codecov.py
          sparse-checkout-cone-mode: false
          path: codecov-uploader

      - name: Download coverage-reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-reports
          path: reports

      - name: Upload reports with verified Codecov CLI
        env:
          TEST_RESULT: ${{ needs.check.result }}
        run: |
          reports=(--junit reports/junit.xml)
          if [[ -f reports/coverage.lcov || "${TEST_RESULT}" != failure ]]; then
            reports+=(--coverage reports/coverage.lcov)
          fi
          python3 -I codecov-uploader/scripts/upload-codecov.py "${reports[@]}"

  zizmor:
    name: zizmor
    needs: generate-matrix
    if: needs.generate-matrix.outputs.run_zizmor == 'true'
    permissions:
      contents: read
      security-events: write # required for zizmor SARIF upload
    uses: starhaven-io/.github/.github/workflows/reusable-zizmor.yml@be272b580ad3812dcafa195db003b178545c2de9 # v2026.10.10.1

  pinprick:
    name: pinprick
    needs: generate-matrix
    if: needs.generate-matrix.outputs.run_zizmor == 'true'
    permissions:
      contents: read
      security-events: write # required for pinprick SARIF upload
    uses: starhaven-io/.github/.github/workflows/reusable-pinprick-audit.yml@be272b580ad3812dcafa195db003b178545c2de9 # v2026.10.10.1
    with:
      advanced-security: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      fail-on-findings: true

  conclusion:
    name: conclusion
    needs: [generate-matrix, commits, check, codeql, zizmor, pinprick, codecov]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    if: always()
    steps:
      - name: Result
        env:
          CODECOV_ELIGIBLE: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
          RUN_CODECOV: ${{ needs.generate-matrix.outputs.run_codecov }}
          CODECOV_RESULT: ${{ needs.codecov.result }}
          COMMITS_RESULT: ${{ needs.commits.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
          PINPRICK_RESULT: ${{ needs.pinprick.result }}
          GENERATOR_RESULT: ${{ needs.generate-matrix.result }}
          MATRIX: ${{ needs.generate-matrix.outputs.matrix }}
          RUN_CODEQL: ${{ needs.generate-matrix.outputs.run_codeql }}
          RUN_ZIZMOR: ${{ needs.generate-matrix.outputs.run_zizmor }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          require_result() {
            local name="$1" result="$2" required="$3"
            case "${required}" in
              true) test "${result}" = success ;;
              false) test "${result}" = skipped ;;
              *) echo "::error::Invalid routing decision for ${name}."; return 1 ;;
            esac || { echo "::error::${name} ended with ${result:-no result}."; return 1; }
          }

          test "${GENERATOR_RESULT}" = "success"
          case "${EVENT_NAME}" in
            pull_request) require_result commits "${COMMITS_RESULT}" true ;;
            push) require_result commits "${COMMITS_RESULT}" false ;;
            *) echo "::error::Unexpected CI event."; exit 1 ;;
          esac
          if [[ "${MATRIX}" == "[]" ]]; then
            require_result check "${CHECK_RESULT}" false
          elif [[ -n "${MATRIX}" ]]; then
            require_result check "${CHECK_RESULT}" true
          else
            echo "::error::The check matrix could not be determined."
            exit 1
          fi
          require_result codeql "${CODEQL_RESULT}" "${RUN_CODEQL}"
          require_result zizmor "${ZIZMOR_RESULT}" "${RUN_ZIZMOR}"
          require_result pinprick "${PINPRICK_RESULT}" "${RUN_ZIZMOR}"
          case "${RUN_CODECOV}:${CODECOV_ELIGIBLE}" in
            true:true) CODECOV_REQUIRED=true ;;
            true:false | false:true | false:false) CODECOV_REQUIRED=false ;;
            *) echo "::error::Invalid Codecov routing decision."; exit 1 ;;
          esac
          require_result codecov "${CODECOV_RESULT}" "${CODECOV_REQUIRED}"
