name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  # PR body/title edits fire `edited` events; give them their own per-run group so
  # they can't cancel in-flight tests from the preceding `opened`/`synchronize` run.
  group: ${{ github.event.action == 'edited' && format('ci-edit-{0}-{1}', github.ref, github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

permissions: {}

jobs:
  generate-matrix:
    name: Generate matrix
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate CI matrix
        id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Push to main: run test-tsan so Codecov has a baseline for PR
          # coverage comparisons.
          if [[ "${EVENT_NAME}" == "push" ]]; then
            echo 'matrix=[{"name":"Test (Thread Sanitizer)","check":"test-tsan","runner":"macos-26","xcodebuild_flags":"-enableCodeCoverage YES -enableThreadSanitizer YES","result_bundle":"TestResults-TSAN","environment":"codecov"}]' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          MATRIX='[]'
          add_check() {
            local entry="$1"
            if [[ "${MATRIX}" == "[]" ]]; then
              MATRIX="[${entry}]"
            else
              MATRIX="${MATRIX%]},${entry}]"
            fi
          }

          # `edited` (title/body/base) also runs the full path-derived matrix. The
          # aggregate "conclusion" job is the only required status check, so it must
          # certify every relevant leg for the current commit. Collapsing to a
          # commits-only matrix on `edited` lets a green run overwrite a prior failing
          # one on the same SHA, bypassing tests, lint, CodeQL and the rest.
          CHANGED=$(git diff --name-only "${BASE_SHA}...HEAD")

          NEEDS_LINT=0
          NEEDS_TESTS=0

          # Swift or CI workflow changes: lint + sanitizer tests
          if grep -qE '\.swift$|^Brewy\.xcodeproj/|^\.swiftlint\.yml$|^\.github/workflows/ci\.yml$' <<< "${CHANGED}"; then
            NEEDS_LINT=1
            NEEDS_TESTS=1
          fi

          # Docs, typo config, or release workflow changes: lint/typos + lockstep checks
          if grep -qE '\.md$|^_typos\.toml$|^\.github/workflows/release\.yml$' <<< "${CHANGED}"; then
            NEEDS_LINT=1
          fi

          if [[ "${NEEDS_LINT}" -eq 1 ]]; then
            add_check '{"name":"Lint","check":"lint","runner":"macos-26"}'
          fi
          if [[ "${NEEDS_TESTS}" -eq 1 ]]; then
            add_check '{"name":"Test (Thread Sanitizer)","check":"test-tsan","runner":"macos-26","xcodebuild_flags":"-enableCodeCoverage YES -enableThreadSanitizer YES","result_bundle":"TestResults-TSAN","environment":"codecov"}'
            # UI test runner is incompatible with ASan (crashes at launch); TSan covers the UI tests.
            add_check '{"name":"Test (Address Sanitizer)","check":"test-asan","runner":"macos-26","xcodebuild_flags":"-enableAddressSanitizer YES -skip-testing:BrewyUITests","result_bundle":"TestResults-ASAN"}'
          fi

          # Source or periphery-config changes: dead-code scan
          if grep -qE '\.swift$|^Brewy\.xcodeproj/|^\.periphery\.yml$|^\.github/workflows/ci\.yml$' <<< "${CHANGED}"; then
            add_check '{"name":"Periphery","check":"periphery","runner":"macos-26"}'
          fi

          # Source changes: CodeQL (excludes xcodeproj-only changes like version bumps)
          if grep -qE '^Brewy/|^BrewyTests/|^BrewyUITests/' <<< "${CHANGED}"; then
            add_check '{"name":"CodeQL","check":"codeql","runner":"macos-26"}'
          fi

          # Workflow changes: Actions security audit
          if grep -qE '^\.github/workflows/' <<< "${CHANGED}"; then
            add_check '{"name":"zizmor","check":"zizmor","runner":"ubuntu-24.04"}'
          fi

          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read # required to read PR titles
    uses: starhaven-io/.github/.github/workflows/reusable-conventional-commits.yml@5f266219bb9c86c8c24f7743bbbe9accb665010c # v2026.07.05.6

  check:
    name: ${{ matrix.name }}
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.matrix != '[]' }}
    runs-on: ${{ matrix.runner }}
    environment:
      name: ${{ matrix.environment }}
      deployment: false
    # Cap at 45m: lint/commits finish in seconds, CodeQL runs ~20m, sanitizer
    # test jobs ~10m. Anything past this is a hang — fail fast instead of
    # burning up to 6h of the default runner budget.
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write # required for CodeQL and zizmor SARIF uploads
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
          persist-credentials: false


      - name: Cache Homebrew downloads
        if: matrix.check == 'lint' || matrix.check == 'periphery'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            homebrew-${{ runner.os }}-

      - name: Install lint tools
        if: matrix.check == 'lint'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ENV_HINTS: 1
        run: brew install swiftlint typos-cli

      - name: SwiftLint
        if: matrix.check == 'lint'
        run: swiftlint --strict

      - name: Typos
        if: matrix.check == 'lint'
        run: typos

      - name: Sparkle version lockstep
        if: matrix.check == 'lint'
        run: |
          PACKAGE_RESOLVED="Brewy.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          RESOLVED_VERSION=$(
            python3 -c '
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as package_resolved:
              pins = json.load(package_resolved).get("pins", [])

          for pin in pins:
              if pin.get("identity") == "sparkle":
                  print(pin.get("state", {}).get("version", ""))
                  break
          ' "${PACKAGE_RESOLVED}"
          )
          RELEASE_VERSION=$(awk -F'"' '/SPARKLE_VERSION:/ { print $2; exit }' .github/workflows/release.yml)
          if [[ -z "${RESOLVED_VERSION}" || -z "${RELEASE_VERSION}" ]]; then
            echo "::error::Could not read Sparkle versions from Package.resolved and release.yml."
            exit 1
          fi
          if [[ "${RESOLVED_VERSION}" != "${RELEASE_VERSION}" ]]; then
            echo "::error::Sparkle Package.resolved version (${RESOLVED_VERSION}) does not match release.yml (${RELEASE_VERSION})."
            exit 1
          fi


      - name: Install Periphery
        if: matrix.check == 'periphery'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ENV_HINTS: 1
        run: brew install periphery

      - name: Periphery
        if: matrix.check == 'periphery'
        # --no-superfluous-ignore-comments: CI's toolchain resolves the SwiftUI $-binding refs the
        # local one misses, so it would otherwise flag the periphery:ignore comments as redundant.
        run: |
          periphery scan --strict --disable-update-check --no-superfluous-ignore-comments \
            -- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO EXCLUDED_ARCHS=x86_64


      - name: Test
        if: startsWith(matrix.check, 'test-')
        env:
          XCODEBUILD_FLAGS: ${{ matrix.xcodebuild_flags }}
          RESULT_BUNDLE: ${{ matrix.result_bundle }}
        run: |
          EXTRA_XCODEBUILD_FLAGS=()
          if [[ -n "${XCODEBUILD_FLAGS}" ]]; then
            read -r -a EXTRA_XCODEBUILD_FLAGS <<< "${XCODEBUILD_FLAGS}"
          fi
          xcodebuild test \
            -project Brewy.xcodeproj \
            -scheme Brewy \
            -destination 'platform=macOS' \
            -derivedDataPath ./DerivedData \
            "${EXTRA_XCODEBUILD_FLAGS[@]}" \
            -resultBundlePath "${RESULT_BUNDLE}.xcresult" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            EXCLUDED_ARCHS=x86_64

      - name: Coverage Summary
        if: success() && matrix.check == 'test-tsan'
        run: xcrun xccov view --report --only-targets TestResults-TSAN.xcresult

      - name: Export LCOV for Codecov
        if: success() && matrix.check == 'test-tsan'
        run: |
          PROFDATA=$(find ./DerivedData -name 'Coverage.profdata' -type f | head -1)
          if [[ -z "${PROFDATA}" ]]; then
            echo "::error::No Coverage.profdata found under ./DerivedData"
            exit 1
          fi
          BINARY_ARGS=()
          FIRST=""
          # Skip bundles nested inside .framework or .xctest — embedded helpers
          # (e.g. Sparkle's Updater.app) ship as universal binaries that
          # llvm-cov can't export without an explicit -arch.
          while IFS= read -r xctest; do
            name=$(basename "${xctest}" .xctest)
            bin="${xctest}/Contents/MacOS/${name}"
            [[ -f "${bin}" ]] || continue
            if [[ -z "${FIRST}" ]]; then FIRST="${bin}"; else BINARY_ARGS+=(-object "${bin}"); fi
          done < <(find ./DerivedData/Build/Products -name '*.xctest' -type d -not -path '*.framework/*' -not -path '*.xctest/*')
          while IFS= read -r app; do
            name=$(basename "${app}" .app)
            # Xcode Debug builds split the app into a launcher stub and a
            # .debug.dylib that carries the instrumentation; prefer the dylib.
            dylib="${app}/Contents/MacOS/${name}.debug.dylib"
            bin="${app}/Contents/MacOS/${name}"
            if [[ -f "${dylib}" ]]; then
              candidate="${dylib}"
            elif [[ -f "${bin}" ]]; then
              candidate="${bin}"
            else
              continue
            fi
            if [[ -z "${FIRST}" ]]; then FIRST="${candidate}"; else BINARY_ARGS+=(-object "${candidate}"); fi
          done < <(find ./DerivedData/Build/Products -name '*.app' -type d -not -path '*.framework/*' -not -path '*.xctest/*' -not -name '*-Runner.app')
          if [[ -z "${FIRST}" ]]; then
            echo "::error::No instrumented binaries found under ./DerivedData/Build/Products"
            exit 1
          fi
          xcrun llvm-cov export -format=lcov \
            -ignore-filename-regex='(Tests/|\.build/|DerivedData/|/Checkouts/|/SourcePackages/)' \
            "${FIRST}" \
            ${BINARY_ARGS[@]+"${BINARY_ARGS[@]}"} \
            -instr-profile="${PROFDATA}" \
            > coverage.lcov
          echo "lcov: $(wc -l < coverage.lcov) lines"

      - name: Upload coverage to Codecov
        if: success() && matrix.check == 'test-tsan'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          fail_ci_if_error: false

      - name: Convert xcresult to JUnit
        if: ${{ !cancelled() && matrix.check == 'test-tsan' }}
        env:
          RESULT_BUNDLE: ${{ matrix.result_bundle }}
        run: python3 scripts/xcresult-to-junit.py "${RESULT_BUNDLE}.xcresult" > junit.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.check == 'test-tsan' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          fail_ci_if_error: false
          report_type: test_results

      - name: Upload Test Results
        if: always() && startsWith(matrix.check, 'test-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.result_bundle }}
          path: ${{ matrix.result_bundle }}.xcresult
          retention-days: 14


      - name: Initialize CodeQL
        if: matrix.check == 'codeql'
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: swift
          build-mode: manual

      - name: Build for CodeQL
        if: matrix.check == 'codeql'
        run: |
          xcodebuild \
            -project Brewy.xcodeproj \
            -scheme Brewy \
            -destination 'generic/platform=macOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            EXCLUDED_ARCHS=x86_64 \
            build

      - name: CodeQL Analysis
        if: matrix.check == 'codeql'
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:swift"


      - name: Run zizmor
        if: matrix.check == 'zizmor'
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          persona: auditor

  conclusion:
    name: conclusion
    needs: [commits, check]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    if: always()
    steps:
      - name: Result
        env:
          COMMITS_RESULT: ${{ needs.commits.result }}
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          test "${COMMITS_RESULT}" = "success" || test "${COMMITS_RESULT}" = "skipped"
          test "${CHECK_RESULT}" = "success" || test "${CHECK_RESULT}" = "skipped"
