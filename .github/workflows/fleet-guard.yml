name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@2b1c73acde5579431808a6222724d5e81a62e3fb # v2026.09.30.2
    with:
      repo-name: ${{ github.event.repository.name }}
