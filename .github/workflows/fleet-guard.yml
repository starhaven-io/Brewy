name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@fa61548f8fe7ee08b5b939bfbec5900c6c54306d # v2026.09.06.4
    with:
      repo-name: ${{ github.event.repository.name }}
