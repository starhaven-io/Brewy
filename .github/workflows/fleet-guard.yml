name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@34619247a11f3f7f6825cd08ca39e0c2be71056e # v2026.10.23.2
    with:
      repo-name: ${{ github.event.repository.name }}
