name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@5516bc8a2030979985d2f69e6017100992444cfb # v2026.09.06.6
    with:
      repo-name: ${{ github.event.repository.name }}
