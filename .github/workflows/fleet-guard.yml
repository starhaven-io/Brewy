name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@42ff761d29005da3693e20c47ca7a0a54814ecca # v2026.10.22.1
    with:
      repo-name: ${{ github.event.repository.name }}
