name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@a2ff1457a008d2fe895f044330469e38d6d97a6d # v2026.09.10.3
    with:
      repo-name: ${{ github.event.repository.name }}
