name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@021b0305d791f2d768eab8b06b8d3d563096c3ef # v2026.10.07.2
    with:
      repo-name: ${{ github.event.repository.name }}
