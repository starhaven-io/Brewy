name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@3febdd066c19c823fb376c21563a6634294df72d # v2026.10.08.4
    with:
      repo-name: ${{ github.event.repository.name }}
