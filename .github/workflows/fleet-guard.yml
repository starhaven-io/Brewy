name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@be272b580ad3812dcafa195db003b178545c2de9 # v2026.10.10.1
    with:
      repo-name: ${{ github.event.repository.name }}
