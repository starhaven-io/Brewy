name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@2185685dd054ef65b23a025807ea86821f97a3d9 # v2026.10.03.1
    with:
      repo-name: ${{ github.event.repository.name }}
