name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@a116f8d13a8021a1fa42c6085aae182185be2688 # v2026.10.16.2
    with:
      repo-name: ${{ github.event.repository.name }}
