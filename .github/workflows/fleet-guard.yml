name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@60f6df5dd0ff8caa0605c069a0d1910e429667a2 # v2026.10.04.1
    with:
      repo-name: ${{ github.event.repository.name }}
