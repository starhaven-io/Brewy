name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@ed413fa67dece92d3870a46750b7a2fb622b2624 # v2026.11.10.1
    with:
      repo-name: ${{ github.event.repository.name }}
