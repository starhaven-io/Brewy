name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@9d720ff00c3d9ecd1d9e13d4f636bf9a1daba5d7 # v2026.07.30.1
    with:
      repo-name: ${{ github.event.repository.name }}
