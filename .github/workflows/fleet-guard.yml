name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@82f0f8e89eeac8a7465e230e6b89cad9dbad8685 # v2026.10.14.1
    with:
      repo-name: ${{ github.event.repository.name }}
