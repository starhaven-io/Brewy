name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@53fd167c64823089351b4c7cebfefdfde2df0ac6 # v2026.09.04.2
    with:
      repo-name: ${{ github.event.repository.name }}
