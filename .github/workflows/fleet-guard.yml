name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@85b63590380becacd87cf3cccf8c2d6ea8146fad # v2026.09.28.1
    with:
      repo-name: ${{ github.event.repository.name }}
