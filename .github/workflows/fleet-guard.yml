name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@9b96b1a5b91cffa111955fdd1ffefe3cb77bf739 # v2026.08.23.1
    with:
      repo-name: ${{ github.event.repository.name }}
