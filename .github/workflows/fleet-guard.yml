name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@1c1fb84659360d176444ef9f7de1db2884c442ba # v2026.09.10.2
    with:
      repo-name: ${{ github.event.repository.name }}
