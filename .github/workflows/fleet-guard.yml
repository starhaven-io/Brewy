name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@730d8d44fa7fb9a4cadad58342b6ce83aeb14bff # v2026.09.30.1
    with:
      repo-name: ${{ github.event.repository.name }}
