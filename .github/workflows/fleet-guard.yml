name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@a93cbf1e015e136ea9d2c19e427dfd5af82b7662 # v2026.08.19.1
    with:
      repo-name: ${{ github.event.repository.name }}
