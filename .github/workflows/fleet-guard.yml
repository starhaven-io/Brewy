name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@e17226c2acb631c8d5887bbff354db21887bed8b # v2026.09.06.3
    with:
      repo-name: ${{ github.event.repository.name }}
