name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@051b9480eed0962e5639830ac3ef06528b3b899c # v2026.11.22.1
    with:
      repo-name: ${{ github.event.repository.name }}
