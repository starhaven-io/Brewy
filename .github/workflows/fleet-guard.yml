name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@bae9f345576e27dad95a955f23698ff353e62e47 # v2026.10.23.1
    with:
      repo-name: ${{ github.event.repository.name }}
