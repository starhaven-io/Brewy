name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@d41aa7355a7aaf88ab370d38464b24d869a0b1c7 # v2026.10.06.1
    with:
      repo-name: ${{ github.event.repository.name }}
