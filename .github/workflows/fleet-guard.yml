name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@1f76a911b7f4fea29eca5983901fa203f38bd303 # v2026.07.27.1
    with:
      repo-name: ${{ github.event.repository.name }}
