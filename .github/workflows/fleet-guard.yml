name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@78b931b0780f83e92162f641956e95c116467036 # v2026.09.06.1
    with:
      repo-name: ${{ github.event.repository.name }}
