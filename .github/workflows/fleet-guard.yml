name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@4be1d0822f8de09e273756b236ccd14e2a5ab8f5 # v2026.09.07.1
    with:
      repo-name: ${{ github.event.repository.name }}
