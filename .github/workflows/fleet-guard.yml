name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@6273eeaf78b82175fe58325af0fa1383aa046a50 # v2026.10.05.1
    with:
      repo-name: ${{ github.event.repository.name }}
