name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@74aa5391c55e434b2d4ffb72e52c8f524bde8a02 # v2026.07.25.1
    with:
      repo-name: ${{ github.event.repository.name }}
