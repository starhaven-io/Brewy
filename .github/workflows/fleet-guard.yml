name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@8d08310ce3bc5b39acfc30f98721febb7ee7c187 # v2026.10.06.2
    with:
      repo-name: ${{ github.event.repository.name }}
