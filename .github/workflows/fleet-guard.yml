name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@4014896493af0ab6d924cfb54b74015e29470b6e # v2026.09.09.1
    with:
      repo-name: ${{ github.event.repository.name }}
