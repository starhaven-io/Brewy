name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@3afdf54c567fdccc85a2d81b96503bf97a48ab51 # v2026.10.03.2
    with:
      repo-name: ${{ github.event.repository.name }}
