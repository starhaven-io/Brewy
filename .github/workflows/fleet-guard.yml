name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@37929bf8f0faf72925aa510f12f9d3e4684d4d25 # v2026.10.08.2
    with:
      repo-name: ${{ github.event.repository.name }}
