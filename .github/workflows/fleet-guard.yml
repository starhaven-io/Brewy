name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@79c2a753cc5d72487a1ae6900cf89a3308ab5330 # v2026.09.09.2
    with:
      repo-name: ${{ github.event.repository.name }}
