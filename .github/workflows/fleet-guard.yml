name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@9783ddfb15b9c91b3f53a2a975067ed4937029ad # v2026.09.25.1
    with:
      repo-name: ${{ github.event.repository.name }}
