name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@46cdbd126a6458a81bbace7a08fa20a062b2fa26 # v2026.10.22.2
    with:
      repo-name: ${{ github.event.repository.name }}
