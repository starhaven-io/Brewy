name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@80092f081219373e83fc99a22d2a012b1c2b4ca4 # v2026.11.16.1
    with:
      repo-name: ${{ github.event.repository.name }}
