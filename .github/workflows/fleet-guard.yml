name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@f94330a416d4e38888a28553aa8efa2725fedbb6 # v2026.10.08.3
    with:
      repo-name: ${{ github.event.repository.name }}
