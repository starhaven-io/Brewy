name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@a2332e3f09757e3a96fdb76b0492a129f0c1a613 # v2026.09.06.5
    with:
      repo-name: ${{ github.event.repository.name }}
