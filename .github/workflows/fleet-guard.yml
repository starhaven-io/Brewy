name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@af61503395f78e467de140427e984d299a1f0d6f # v2026.10.07.1
    with:
      repo-name: ${{ github.event.repository.name }}
