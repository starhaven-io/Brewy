name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@5f3d865798c6a3b26963526239b2a03413e34830 # v2026.09.16.1
    with:
      repo-name: ${{ github.event.repository.name }}
