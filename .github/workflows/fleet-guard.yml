name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@7b7327f6525b2e72ff64200c0b9ba5051a30bd2f # v2026.09.07.2
    with:
      repo-name: ${{ github.event.repository.name }}
