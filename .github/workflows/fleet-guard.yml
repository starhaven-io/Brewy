name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@f2743b4ed9ea23c0e1c9ba2f39345b8a74070039 # v2026.10.16.1
    with:
      repo-name: ${{ github.event.repository.name }}
