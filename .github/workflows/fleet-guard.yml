name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@6609393edf09724f36065996afcbb3d6748fd9f6 # v2026.11.20.1
    with:
      repo-name: ${{ github.event.repository.name }}
