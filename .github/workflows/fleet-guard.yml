name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@17ee5cc7f6fe6aa30883a54f7d890dd8908e250a # v2026.10.08.1
    with:
      repo-name: ${{ github.event.repository.name }}
