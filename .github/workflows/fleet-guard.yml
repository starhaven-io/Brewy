name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@f6a3d514cad72529815a4bb35e7e0e2fc02dc637 # v2026.07.26.1
    with:
      repo-name: ${{ github.event.repository.name }}
