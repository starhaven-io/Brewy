name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@d4d091998efd14cbd248589dea26ecffd9020d25 # v2026.10.02.1
    with:
      repo-name: ${{ github.event.repository.name }}
