name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@24c92ca6f7f84ca1a76f1958f068e2b586a6015e # v2026.10.10.4
    with:
      repo-name: ${{ github.event.repository.name }}
