name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@fbffa17ec102207af4f3457222f515662b0f3e16 # v2026.09.25.2
    with:
      repo-name: ${{ github.event.repository.name }}
