name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@9ae49e472a3025f0d232077b6d7552f03a0ced1a # v2026.10.12.1
    with:
      repo-name: ${{ github.event.repository.name }}
