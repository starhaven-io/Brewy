name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@d7f6583ac87788728fc94831cbc5d2cd3865b89b # v2026.10.17.1
    with:
      repo-name: ${{ github.event.repository.name }}
