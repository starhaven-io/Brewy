name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@2e730ee55e49d6c7295818a25fde6aabc8c1493f # v2026.09.29.1
    with:
      repo-name: ${{ github.event.repository.name }}
