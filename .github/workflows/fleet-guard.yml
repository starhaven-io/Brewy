name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@5b3c5a3c6514fd70016a049935b55b84345ce82a # v2026.09.23.1
    with:
      repo-name: ${{ github.event.repository.name }}
