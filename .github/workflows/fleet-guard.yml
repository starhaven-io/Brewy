name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@1dfa7e3fd45a0982180231823e60406bc80f0500 # v2026.09.06.2
    with:
      repo-name: ${{ github.event.repository.name }}
