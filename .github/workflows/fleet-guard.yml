name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@e748ec16bd1207114a766d1d761a6743a6e3bf3a # v2026.09.09.4
    with:
      repo-name: ${{ github.event.repository.name }}
