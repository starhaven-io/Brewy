name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@ad5dbd8d426bac03bcc26cac8cc0771926de90a5 # v2026.07.27.2
    with:
      repo-name: ${{ github.event.repository.name }}
