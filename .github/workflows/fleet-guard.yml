name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@01259585bcefd122469b50cd7cbe6d593635619f # v2026.09.09.3
    with:
      repo-name: ${{ github.event.repository.name }}
