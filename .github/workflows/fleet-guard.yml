name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@485aa497c731ef165f156edb09694d3aa110653e # v2026.10.06.3
    with:
      repo-name: ${{ github.event.repository.name }}
