name: Fleet Guard

on:
  pull_request:

permissions: {}

concurrency:
  group: "fleet-guard-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-fleet-guard.yml@147f3c0703b69365dc0fdc39004ef23dd5029f23 # v2026.11.18.1
    with:
      repo-name: ${{ github.event.repository.name }}
