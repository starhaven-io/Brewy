name: Xcode 27 Preview

on:
  workflow_dispatch:
  schedule:
    - cron: "31 9 * * 1"

permissions: {}

concurrency:
  group: xcode-27-preview-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -xeuo pipefail {0}

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  preview:
    name: Xcode 27 — ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: build
            name: Build (Release)
          - check: thread
            name: Test (Thread Sanitizer)
          - check: address
            name: Test (Address Sanitizer)
          - check: ui
            name: Test (signed UI runner)
    env:
      PREVIEW_CHECK: ${{ matrix.check }}
    steps:
      - name: Record and verify toolchain
        run: |
          {
            sw_vers
            uname -m
            printf 'Runner image: %s / %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            printf 'Developer directory: %s\n' "${DEVELOPER_DIR}"
            XCODE_VERSION=$(xcodebuild -version)
            printf '%s\n' "${XCODE_VERSION}"
            xcrun swift --version
            xcrun --sdk macosx --show-sdk-version
            if [[ "$(sw_vers -productVersion)" != 27.* || "$(uname -m)" != arm64 ]]; then
              echo "::error::Expected macOS 27 on ARM64"
              exit 1
            fi
            case "${XCODE_VERSION%%$'\n'*}" in
              "Xcode 27.0"|"Xcode 27.0."*) ;;
              *) echo "::error::Expected Xcode 27.0"; exit 1 ;;
            esac
          } 2>&1 | tee "${RUNNER_TEMP}/xcode-27-toolchain.txt"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build or test
        run: |
          FLAGS=(
            -project Brewy.xcodeproj
            -scheme Brewy
            -derivedDataPath "${RUNNER_TEMP}/Xcode27-${PREVIEW_CHECK}"
            -onlyUsePackageVersionsFromResolvedFile
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
            EXCLUDED_ARCHS=x86_64
          )
          SIGNING=(CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO)
          case "${PREVIEW_CHECK}" in
            build)
              FLAGS+=(build -configuration Release -destination 'generic/platform=macOS')
              ;;
            thread|address)
              FLAGS+=(test -destination 'platform=macOS' -only-testing:BrewyTests)
              if [[ "${PREVIEW_CHECK}" == thread ]]; then
                FLAGS+=(-enableThreadSanitizer YES)
              else
                FLAGS+=(-enableAddressSanitizer YES)
              fi
              ;;
            ui)
              FLAGS+=(test -destination 'platform=macOS' -only-testing:BrewyUITests)
              SIGNING=(CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM=)
              ;;
            *) echo "::error::Unknown preview check: ${PREVIEW_CHECK}"; exit 1 ;;
          esac
          if [[ "${PREVIEW_CHECK}" != build ]]; then
            FLAGS+=(-resultBundlePath "${RUNNER_TEMP}/Xcode27-${PREVIEW_CHECK}.xcresult")
          fi
          xcodebuild "${FLAGS[@]}" "${SIGNING[@]}" 2>&1 |
            tee "${RUNNER_TEMP}/xcode-27-build-test.log"

      - name: Verify tests ran
        if: matrix.check != 'build'
        run: |
          xcrun xcresulttool get test-results summary \
            --path "${RUNNER_TEMP}/Xcode27-${PREVIEW_CHECK}.xcresult" --compact |
            jq -e '.totalTestCount > 0'

      - name: Verify UI test signatures
        if: matrix.check == 'ui'
        run: |
          PRODUCTS="${RUNNER_TEMP}/Xcode27-ui/Build/Products"
          BREWY_APP=$(find "${PRODUCTS}" -name Brewy.app -type d -print -quit)
          UI_TEST_BUNDLE=$(find "${PRODUCTS}" -name BrewyUITests.xctest -type d -print -quit)
          RUNNER_APP=$(find "${PRODUCTS}" -name BrewyUITests-Runner.app -type d -print -quit)
          test -n "${BREWY_APP}"
          test -n "${UI_TEST_BUNDLE}"
          test -n "${RUNNER_APP}"
          codesign --verify --deep --strict --verbose=2 "${BREWY_APP}"
          codesign --verify --strict --verbose=2 "${UI_TEST_BUNDLE}"
          codesign --verify --deep --strict --verbose=2 "${RUNNER_APP}"

      - name: Upload preview diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Xcode27-${{ matrix.check }}
          path: |
            ${{ runner.temp }}/xcode-27-toolchain.txt
            ${{ runner.temp }}/xcode-27-build-test.log
            ${{ runner.temp }}/Xcode27-${{ matrix.check }}.xcresult
          if-no-files-found: error
          retention-days: 14
