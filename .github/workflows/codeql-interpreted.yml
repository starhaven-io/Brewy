name: CodeQL (scripts)

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/format-release-notes.rb"
      - "Gemfile"
      - "Gemfile.lock"
      - ".ruby-version"
      - ".github/workflows/codeql-interpreted.yml"

concurrency:
  group: "codeql-interpreted-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@9ae49e472a3025f0d232077b6d7552f03a0ced1a # v2026.10.12.1
    with:
      languages: '["ruby"]'
      runner: "ubuntu-slim"
