name: CodeQL (scripts)

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/format-release-notes.rb"
      - "Gemfile"
      - "Gemfile.lock"
      - ".ruby-version"
      - ".github/workflows/codeql-interpreted.yml"

concurrency:
  group: "codeql-interpreted-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@24c92ca6f7f84ca1a76f1958f068e2b586a6015e # v2026.10.10.4
    with:
      languages: '["ruby"]'
      runner: "ubuntu-slim"
